[package]
name = "libu-derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies.darling]
version = "0.23.0"

[dependencies.proc-macro2]
version = "1.0.95"

[dependencies.quote]
version = "1.0.40"

[dependencies.syn]
version = "2.0.104"
features = ["full", "parsing", "printing", "extra-traits", "proc-macro", "derive", "clone-impls"]

[dev-dependencies]
flume = { version = "0.12.0", default-features = false, features = ['select'] }
trybuild = "1.0.120"
